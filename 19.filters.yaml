- name: demo on filters
  hosts: local
  connection: local
  vars:
    topics: linux, shell, ansible, terraform
    course: "Ansible for DevOps"
    tagsMap:
      name: ansible
      project: roboshop
      component: catalogue
    tagslist: [
      { 
         "key": "name",
         "value": "ansible"
      },
      {
         "key": "project",
         "value": "roboshop"
      },
      {
         "key": "component",
         "value": "catalogue" 
      }
    ]
  tasks:
  - name: greeting
    ansible.builtin.debug:
      msg: "Hi Pavan Reddy, {{greeting | default('Welcome to Ansible') }}"

  - name: convert string to lists
    ansible.builtin.debug:
      msg: "{{ topics | split (',')}}"

  - name: map to list
    ansible.builtin.debug:
      msg: "{{ tagsMap | dict2items }}" 

  - name: convert list to map
    ansible.builtin.debug:
      msg: "{{ tagslist | items2dict }}"


  - name: read studnets.yaml file
    ansible.builtin.set_fact:  #setting the variable dynamically 
      student_yaml: "{{ lookup('file', 'students.yaml') | from_yaml }}"

  - name: convert yaml to json
    ansible.builtin.debug:
      msg: "{{ student_yaml | to_nice_json }}"
  
  - name: convert to upper case
    ansible.builtin.debug:
      msg: "{{ course | upper }}"

  - name: convert to lower case
    ansible.builtin.debug:
      msg: "{{ course | lower }}"
  
  